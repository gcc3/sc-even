<!doctype html>
<!-- The sc terminal: one text box that is the whole window. Structure only — style.css has
     the look (and the CLI's three themes), app.js the behaviour, boot.js the one thing that
     has to happen before the first paint. Served by serve.mjs at `/`, same origin as the
     /api/sc endpoints app.js talks to. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Fixed scale: iOS zooms the page in when a field smaller than 16px takes focus, which
         would push the terminal past the window edge. Same meta as the glasses app's. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>sc</title>
    <!-- No icon, said explicitly: an empty href stops the browser asking for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <!-- What a mobile browser paints its own chrome with; app.js keeps it in step with the theme. -->
    <meta name="theme-color" content="#ffffff" />

    <link rel="stylesheet" href="/style.css" />
    <script src="/boot.js"></script>

    <!-- Fira Code (variable, with ligatures) — same CDN the glasses app uses. Loaded through
         the `media` swap rather than an @import, because a stylesheet still downloading holds
         up every script on the page: a CDN that hangs would leave the terminal unstarted, and
         a font is not worth that. Until it lands (or if it never does) the monospace
         fallbacks in style.css are what shows. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/fira_code.css"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <!-- The terminal is drawn twice, because a textarea can carry neither a ::after nor a
         block caret: #mirror paints the text and the cursor, #terminal lies on top of it with
         invisible glyphs and does the typing, selecting and scrolling. -->
    <div id="screen">
      <pre id="mirror" aria-hidden="true"></pre>
      <textarea
        id="terminal"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        aria-label="sc terminal"
        disabled
      ></textarea>
    </div>
    <div id="notice">starting sc…</div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
