<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Fixed scale: iOS zooms the page in when a field smaller than 16px takes focus, which
         would push the terminal past the window edge. Same meta as the glasses app's. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>sc</title>
    <!-- No icon, said explicitly: an empty href stops the browser asking for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <!-- The whole page is the sc terminal: the scrollback, the prompt and the line being
         typed are one text box, so the caret sits after the prompt the way it does in a
         real one. Black on white, Fira Code, nothing else. Served by serve.mjs at `/`,
         same origin as the API below. -->
    <style>
      /* Fira Code (variable, with ligatures) — same CDN the glasses app uses; if it's
         unreachable the monospace fallbacks below kick in. */
      @import url(https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/fira_code.css);

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      /* The terminal is the window: it fills it on load and follows every resize. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        color: #000000;
        /* Nothing to scroll past the box, so no rubber-banding either. */
        overscroll-behavior: none;
      }

      /* A mobile toolbar takes its bite out of the viewport, and `100%` measures the one
         without it — so the box would end short. dvh is the height actually on screen;
         browsers that don't know it keep the `100%` above. */
      body {
        height: 100dvh;
      }

      #terminal {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        resize: none;
        padding: 16px;
        background: transparent;
        color: inherit;
        caret-color: #000000;
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        overflow-y: auto;
        /* Scrolls, but without a scrollbar drawing a second colour on the page */
        scrollbar-width: none;
      }

      #terminal::-webkit-scrollbar {
        display: none;
      }

      /* A disabled field is the browser's cue to paint its own grey; the page stays white
         and says what is going on with the notice instead. */
      #terminal:disabled {
        background: transparent;
        color: #999999;
        -webkit-text-fill-color: #999999;
      }

      /* Waiting on the server, or nothing there to wait on: said in the middle of the
         page, not written into the session. */
      #notice {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        text-align: center;
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        color: #666666;
        background: #ffffff;
      }

      #notice[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <textarea
      id="terminal"
      spellcheck="false"
      autocomplete="off"
      autocapitalize="off"
      aria-label="sc terminal"
      disabled
    ></textarea>
    <div id="notice">starting sc…</div>

    <script type="module">
      const el = document.getElementById("terminal");
      const notice = document.getElementById("notice");

      // Which sc process on the server this page talks to. Kept in sessionStorage so a
      // reload lands back in the same conversation (the server holds an idle process for
      // SC_SESSION_TTL after the stream drops).
      const KEY = "sc-session";
      let session = sessionStorage.getItem(KEY);
      if (!session) {
        session = crypto.randomUUID?.() ?? `s-${Date.now()}-${Math.floor(Math.random() * 1e9)}`;
        sessionStorage.setItem(KEY, session);
      }

      // Everything the CLI has printed, plus the lines we echoed for it (its stdin is a
      // pipe, so it echoes nothing itself). Append-only — this is the scrollback.
      let log = "";
      // The line being typed, i.e. everything after the prompt.
      let draft = "";
      // Waiting on a reply: Enter does nothing until the CLI's prompt is back.
      let busy = false;
      // The prompt the CLI last left on screen, so an error can put it back.
      let prompt = "";
      let live = false;
      // Whether new output should scroll into view — false while the reader has scrolled up.
      let stick = true;

      // Keep the scrollback bounded, cutting at a line break so the top stays readable.
      const MAX_CHARS = 200000;
      function cap(text) {
        if (text.length <= MAX_CHARS) return text;
        const tail = text.slice(-MAX_CHARS);
        const nl = tail.indexOf("\n");
        return nl === -1 ? tail : tail.slice(nl + 1);
      }

      /** The `model> ` prompt at the end of the CLI's output, or "" if it isn't idle there. */
      function trailingPrompt(text) {
        return text.match(/[A-Za-z0-9_.-]*>[ \t]$/)?.[0] ?? "";
      }

      // `:login <user> <password>` is forwarded to the CLI as typed, but the line we echo
      // stays on screen — so the password doesn't.
      function forScrollback(line) {
        const login = line.match(/^(:login\s+\S+\s+)(\S+)(.*)$/i);
        return login ? `${login[1]}${"*".repeat(login[2].length)}${login[3]}` : line;
      }

      function paint() {
        // Rewriting .value parks the caret at the end, which is where a terminal keeps it.
        // A reader who has selected text to copy is left alone.
        const from = el.selectionStart;
        const to = el.selectionEnd;
        const hadRange = from !== to;
        el.value = log + draft;
        if (hadRange) el.setSelectionRange(from, to);
        if (stick) el.scrollTop = el.scrollHeight;
      }

      function append(text) {
        log = cap(log + text);
        const next = trailingPrompt(text);
        if (next) prompt = next;
        paint();
      }

      function setPhase(phase, message) {
        live = phase === "live";
        el.disabled = !live;
        notice.hidden = live;
        if (!live) notice.textContent = message;
        else if (document.activeElement !== el) el.focus();
      }

      async function post(path, body) {
        try {
          const res = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session, ...body }),
          });
          return res.ok ? {} : { error: `server answered ${res.status}` };
        } catch (err) {
          return { error: err instanceof Error ? err.message : String(err) };
        }
      }

      function submit() {
        const line = draft.trim();
        if (!line || busy || !live) return;
        draft = "";
        append(`${forScrollback(line)}\n`);
        busy = true;
        stick = true;
        void post("/api/sc/send", { text: line }).then((res) => {
          if (res.error) {
            busy = false;
            append(`[${res.error}]\n${prompt}`);
          }
        });
      }

      el.addEventListener("input", () => {
        const next = el.value;
        // Only the tail after the prompt is editable; an edit reaching into the scrollback
        // is put back as it was.
        if (!next.startsWith(log)) {
          paint();
          return;
        }
        // A pasted block would otherwise become several stdin lines.
        draft = next.slice(log.length).replace(/[\r\n]+/g, " ");
      });

      el.addEventListener("keydown", (e) => {
        // Enter runs the line. A live IME composition keeps it, so committing a candidate
        // with Enter does not submit half a sentence.
        if (e.key === "Enter" && !e.isComposing) {
          e.preventDefault();
          submit();
        }
      });

      el.addEventListener("scroll", () => {
        stick = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      });

      const source = new EventSource(`/api/sc/stream?session=${encodeURIComponent(session)}`);

      source.addEventListener("chunk", (e) => {
        // Straight into the scrollback, banner and prompt included, exactly as the CLI
        // printed it — this page is a view of the terminal, not a chat transcript.
        setPhase("live");
        append(JSON.parse(e.data));
      });

      source.addEventListener("ready", () => {
        busy = false;
        setPhase("live");
      });

      source.addEventListener("error", () => {
        // EventSource retries a dropped connection itself (readyState CONNECTING) and gives
        // up for good on a reply that is not an event stream (CLOSED). Neither has a CLI
        // behind it, and both have to be said out loud or the page waits forever.
        if (source.readyState !== EventSource.OPEN) setPhase("down", "no answer from the sc server");
      });

      // A reload that resumed a still-running sc gets no banner — that went to the page
      // we just replaced — so there is nothing on screen to type at. `:info` is a cheap
      // way to ask for a fresh prompt (and it says which session and model this is).
      setTimeout(() => {
        if (!log && source.readyState === EventSource.OPEN) void post("/api/sc/send", { text: ":info" });
      }, 1500);
    </script>
  </body>
</html>
